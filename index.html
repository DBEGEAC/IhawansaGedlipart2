<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ihawan sa Gedli POS</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.6.2/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="container mt-4">
    <div class="row">
      <div class="col-md-6 mb-4">
        <div class="box p-4">
          <h2 class="text-center mb-4">IhawansaGedli Menu</h2>
          <div id="menu-items" class="d-flex flex-column gap-3"></div>
        </div>
      </div>

      <div class="col-md-6 mb-4">
        <div class="box p-4">
          <h2 class="text-center mb-4">Order Summary</h2>
          <ul id="order-list" class="list-group mb-3"></ul>
          <h4>Total: ₱<span id="total-price">0</span></h4>
          <div class="mt-4">
            <button id="print-receipt" class="btn btn-success mr-2">Print Receipt</button>
            <button id="clear-order" class="btn btn-danger">Clear Order</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
